name: CI

# The primary gate for every pull request and every push to main.
# All four steps (typecheck, lint, test, build) must pass green or the
# corresponding branch protection rule (see CONTRIBUTING.md) blocks the merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Cancel in-flight runs when a new commit is pushed to the same PR.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Test-only dummy values that satisfy the required-always bucket of
      # lib/env.ts. None of these are live secrets. Real production values
      # live in Vercel Environment Variables, not here.
      APP_ENV: test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://demo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon_ci_placeholder
      GROQ_API_KEY: gsk_ci_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint (ratchet — fails when warnings exceed baseline)
        run: npm run lint:ci

      - name: Vitest
        run: npm test

      - name: Coverage (advisory)
        run: npm run test:coverage
        continue-on-error: true

      - name: Next.js production build
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # Playwright end-to-end suite. Runs after the primary CI job so a broken
  # build does not waste browser-download time. Marked continue-on-error at
  # the workflow level because GitHub-hosted runners occasionally have DNS /
  # ratelimit flakes on Clerk during the smoke tests; treat failures as
  # advisory until we have a dedicated E2E environment.
  # ─────────────────────────────────────────────────────────────────────────
  e2e:
    name: Playwright E2E (advisory)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    env:
      APP_ENV: test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://demo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon_ci_placeholder
      GROQ_API_KEY: gsk_ci_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
